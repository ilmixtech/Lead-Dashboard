function lineChart(arr){
  const end=state.dateTo?new Date(state.dateTo+'T12:00:00'):new Date();
  let start=state.dateFrom?new Date(state.dateFrom+'T12:00:00'):null;
  if(!start){const times=arr.map(l=>parseDate(l.created_at).getTime()).filter(Number.isFinite);start=times.length?new Date(Math.min(...times)):new Date(end.getTime()-29*86400000)}
  start.setHours(0,0,0,0);end.setHours(23,59,59,999);
  if(start>end)return '<div class="empty">Please choose a valid date range.</div>';
  const days=Math.floor((end-start)/86400000)+1;
  const unit=days>2000?'year':days>180?'month':days>56?'week':'day';
  function bucket(d){if(unit==='year')return String(d.getFullYear());if(unit==='month')return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;if(unit==='week'){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return dayKey(x)}return dayKey(d)}
  const groups=new Map(),pointer=new Date(start.getFullYear(),start.getMonth(),start.getDate());
  for(let n=0;pointer<=end&&n<2500;n++){const b=bucket(pointer);if(!groups.has(b))groups.set(b,{key:b,total:0,yes:0,no:0,pending:0});if(unit==='year')pointer.setFullYear(pointer.getFullYear()+1);else if(unit==='month')pointer.setMonth(pointer.getMonth()+1);else pointer.setDate(pointer.getDate()+1)}
  for(const l of arr){const d=parseDate(l.created_at);if(isNaN(d.getTime())||d<start||d>end)continue;const row=groups.get(bucket(d));if(!row)continue;row.total++;const kind=safeStatus(l.status);row[kind==='Interested'?'yes':kind==='Not Interested'?'no':'pending']++}
  const rows=[...groups.values()];if(!rows.length)return '<div class="empty">No dates available.</div>';
  const maxValue=Math.max(1,...rows.map(r=>r.total)),step=Math.max(1,Math.ceil(maxValue/4)),maximum=step*4;
  const compact=window.innerWidth<600;const width=compact?390:740,height=compact?220:260,left=34,top=13,right=12,bottom=compact?37:43,plotW=width-left-right,plotH=height-top-bottom;
  const x=i=>left+(rows.length===1?plotW/2:(i/(rows.length-1))*plotW);
  const y=n=>top+plotH-(n/maximum)*plotH;
  const series=[['total','#405d6d','Total leads'],['yes','#4b806f','Interested'],['no','#c27d73','Not interested'],['pending','#b79c69','Unmarked']];
  const paths=series.map(([k,color,label])=>{const path=rows.map((r,i)=>`${i===0?'M':'L'}${x(i).toFixed(2)},${y(r[k]).toFixed(2)}`).join(' ');
   const pts=rows.map((r,i)=>`<circle cx="${x(i).toFixed(2)}" cy="${y(r[k]).toFixed(2)}" r="${rows.length<58?2.8:2}" fill="${color}" class="line-point"><title>${esc(r.key)}: ${label}: ${r[k]}</title></circle>`).join('');
   return `<path d="${path}" fill="none" stroke="${color}" stroke-width="${k==='total'?2.8:2.1}" stroke-linejoin="round" stroke-linecap="round"/><g>${pts}</g>`}).join('');
  const axes=Array.from({length:5},(_,i)=>{const value=i*step,yy=y(value);return `<line class="trend-grid" x1="${left}" x2="${width-right}" y1="${yy}" y2="${yy}"/><text class="trend-label" x="${left-9}" y="${yy+4}" text-anchor="end">${value}</text>`}).join('');
  const tickEvery=Math.max(1,Math.ceil(rows.length/(compact?4:7)));const tickLabels=rows.map((r,i)=>i===0||i===rows.length-1||(i%tickEvery===0&&(rows.length-1-i)>=tickEvery)?`<text class="trend-label" x="${x(i)}" y="${height-17}" text-anchor="middle">${esc(r.key.length===10?r.key.slice(5):r.key)}</text>`:'').join('');
  return `<div class="xy-scroll"><svg class="trend-svg xy-lines" viewBox="0 0 ${width} ${height}" role="img" aria-label="Line graph of total, interested, not interested and unmarked leads over time">${axes}${paths}${tickLabels}</svg></div>`;
}

function opsColumns(leads){
 const period=state.chartDays||7;
 const rightDate=state.dateTo?new Date(state.dateTo+'T12:00:00'):new Date();
 rightDate.setHours(23,59,59,999);
 const desiredStart=new Date(rightDate);desiredStart.setDate(desiredStart.getDate()-period+1);desiredStart.setHours(0,0,0,0);
 const userStart=state.dateFrom?new Date(state.dateFrom+'T00:00:00'):null;
 const from=userStart&&userStart>desiredStart?userStart:desiredStart;
 let allDays=[];
 for(let t=new Date(from);t<=rightDate&&allDays.length<31;t.setDate(t.getDate()+1))allDays.push(new Date(t));
 if(!allDays.length)return '<div class="ops-graph-empty">Please choose a valid date range.</div>';
 const groupSize=Math.max(1,Math.ceil(allDays.length/7));
 const groups=[];
 for(let i=0;i<allDays.length;i+=groupSize){const segment=allDays.slice(i,i+groupSize);groups.push({start:segment[0],end:segment[segment.length-1],total:0,yes:0,no:0,pending:0})}
 const inRange=leads.filter(l=>{const d=parseDate(l.created_at);return d&&!isNaN(d)&&d>=from&&d<=rightDate});
 for(const l of inRange){const d=parseDate(l.created_at);const elapsed=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(from.getFullYear(),from.getMonth(),from.getDate()))/86400000);const g=groups[Math.min(groups.length-1,Math.floor(elapsed/groupSize))];if(!g)continue;g.total++;const kind=safeStatus(l.status);g[kind==='Interested'?'yes':kind==='Not Interested'?'no':'pending']++}
 const peak=Math.max(1,...groups.map(g=>g.total));
 const sum={total:0,yes:0,no:0,pending:0};inRange.forEach(l=>{sum.total++;const k=safeStatus(l.status);sum[k==='Interested'?'yes':k==='Not Interested'?'no':'pending']++});
 const shortDateText=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
 const graph=groups.map(g=>{
    const height=g.total?Math.max(7,Math.round((g.total/peak)*100)):0;
    const label=g.start.getDate()===g.end.getDate()?shortDateText(g.start):`${g.start.getDate()}–${g.end.getDate()} ${g.end.toLocaleDateString(undefined,{month:'short'})}`;
    const tip=`${label}: ${g.total} total, ${g.yes} interested, ${g.no} not interested, ${g.pending} unmarked`;
    const denom=Math.max(g.total,1);
    return `<div class="ops-col" title="${esc(tip)}"><div class="ops-col-plot"><span class="ops-col-count">${g.total||''}</span><div class="ops-col-track"><div class="ops-col-stack" style="height:${height}%">${g.pending?`<i class="ops-segment pending" style="height:${g.pending/denom*100}%"></i>`:''}${g.no?`<i class="ops-segment no" style="height:${g.no/denom*100}%"></i>`:''}${g.yes?`<i class="ops-segment yes" style="height:${g.yes/denom*100}%"></i>`:''}</div></div></div><span class="ops-col-date">${esc(label)}</span></div>`
 }).join('');
 const caption=state.dateTo||state.dateFrom?'Based on your date filter':'Recent activity';
 return `<section class="ops-graph-panel"><div class="ops-graph-head"><div><p class="ops-kicker">LEAD ACTIVITY</p><h2>When did leads come in?</h2><p class="ops-description">${caption} · Total leads shown above each bar</p></div><div class="ops-period-switch" role="group" aria-label="Graph time range">${[7,14,30].map(d=>`<button type="button" data-action="chart${d}" class="${period===d?'on':''}" aria-pressed="${period===d}">${d}d</button>`).join('')}</div></div><div class="ops-plot">${graph}</div><div class="ops-graph-foot"><div class="ops-mini-legend"><span><i class="yes"></i> Interested</span><span><i class="no"></i> Not interested</span><span><i class="pending"></i> Unmarked</span></div><span class="ops-graph-total"><strong>${sum.total}</strong> leads in chart</span></div></section>`;
}

// Dependency-free Supabase RPC wrapper. Keeps the existing Supabase SQL functions
// and the rest of the dashboard unchanged; reports errors instead of hanging.
function createRpcClient(){
  const root=SUPABASE_URL.replace(/\/$/,'');
  return {
    async rpc(functionName,payload={}){
      const controller=new AbortController();
      const abortTimer=setTimeout(()=>controller.abort(),15000);
      try{
        const response=await fetch(root+'/rest/v1/rpc/'+encodeURIComponent(functionName),{
          method:'POST',
          mode:'cors',
          cache:'no-store',
          headers:{
            'apikey':SUPABASE_PUBLISHABLE_KEY,
            'Content-Type':'application/json',
            'Accept':'application/json'
          },
          body:JSON.stringify(payload),
          signal:controller.signal
        });
        const raw=await response.text();
        let result=null;
        if(raw){try{result=JSON.parse(raw)}catch{result=raw}}
        if(!response.ok){
          const message=(result&&typeof result==='object'&&result.message)||('HTTP '+response.status);
          const detail=(result&&typeof result==='object'&&result.details)||'';
          return {data:null,error:{message:message+(detail?' — '+detail:''),code:(result&&result.code)||String(response.status)}};
        }
        return {data:result,error:null};
      }catch(error){
        const timedOut=error&&error.name==='AbortError';
        return {data:null,error:{message:timedOut?'Request timed out. Check your internet connection.':'Network request failed. Verify your connection, Supabase project URL and allowed site origin.',code:'NETWORK'}};
      }finally{clearTimeout(abortTimer)}
    }
  };
}

async function checkAuthorized(){
 if(!sessionToken){authorized=false;return false}
 const {data,error}=await sb.rpc('ilmix_password_session',{p_token:sessionToken});
 if(error)throw Error('Could not verify SQL login: '+error.message);
 authorized=data===true;
 if(!authorized){forgetToken();sessionToken=''}
 return authorized;
}
async function initialize(){
 try{
  sb=createRpcClient();
  sessionToken=savedToken();
  if(sessionToken){if(await checkAuthorized()){await refresh(true);startActiveCountPolling();}else authBootError='Your login expired. Enter your password again.'}
 }catch(e){authorized=false;authBootError='SQL login connection error: '+e.message+'. Run PASSWORD_ONLY_LOGIN.sql in Supabase SQL Editor.'}
 render();
}
async function login(){
 const btn=$('loginBtn'),pass=$('adminPassword')?.value||'';
 if(!btn)return;
 if(!pass){$('loginError').textContent='Please enter your dashboard password.';return;}
 btn.disabled=true;btn.textContent='Logging in…';$('loginError').textContent='Checking password…';
 try{
  if(!sb)throw Error('Supabase is not ready');
  const {data,error}=await sb.rpc('ilmix_password_login',{p_password:pass});
  if(error)throw Error(error.code==='PGRST202'||error.code==='404'?'Login function is missing in Supabase. Run PASSWORD_ONLY_LOGIN.sql in SQL Editor.':'Login connection error: '+error.message);
  if(data?.error==='invalid_password')throw Error('Wrong password. If you used another password before, run RESET_PASSWORD_TO_ILMIX.sql in Supabase SQL Editor.');
  if(data?.error==='locked')throw Error('Too many attempts. Try again in one minute.');
  if(data?.error==='not_configured')throw Error('Password has not been configured in Supabase SQL.');
  if(!data?.token)throw Error('SQL did not return a login session.');
  sessionToken=data.token;saveToken(sessionToken);authorized=true;
  state.leads=[];state.error='';await refresh(true);render();startActiveCountPolling();
 }catch(e){const el=$('loginError');if(el)el.textContent=e.message;btn.disabled=false;btn.textContent='Log in →';}
}
async function logout(){
 stopActiveCountPolling();
 const oldToken=sessionToken;
 sessionToken='';authorized=false;state.leads=[];state.analytics=null;state.analyticsError='';state.lastSync=null;state.error='';forgetToken();render();
 if(sb&&oldToken){try{await sb.rpc('ilmix_password_logout',{p_token:oldToken})}catch{}}
}
document.addEventListener('click',e=>{if(!authorized)return;const target=e.target.closest('[data-page],[data-action],[data-filter],[data-status],[data-open],[data-pick],[data-reply],[data-preset],[data-cal-day]');if(!target){if(state.dateOpen&&!e.target.closest('.date-wrap')){state.dateOpen=false;render()}return}const {page,action,filter,status,id,open,pick,reply,preset,calDay}=target.dataset;if(page){setPage(page);return}if(filter){state.statusFilter=filter;state.selected=null;render();return}if(status&&id){updateLead(id,{status:status==='Interested'?'interested':'not_interested'});return}if(open){state.selected=open;render();return}if(pick){state.selected=pick;render();return}if(reply){replyTo(reply);return}if(calDay){applyDate(calDay,calDay);state.page='leads';render();return}if(preset){const d=new Date(),t=dayKey(d);if(preset==='today')applyDate(t,t);if(preset==='all')applyDate('','');if(['week','days14','days30','days90','days180','days365'].includes(preset)){const n=({week:7,days14:14,days30:30,days90:90,days180:180,days365:365})[preset];d.setDate(d.getDate()-(n-1));applyDate(dayKey(d),t)}if(preset==='month'){d.setDate(1);applyDate(dayKey(d),t)}return}switch(action){case 'toggleMenu':state.menu=!state.menu;render();break;case 'closeMenu':state.menu=false;render();break;case 'openConnect':notify('Supabase is configured.');break;case 'closeModal':state.modal=false;render();break;case 'openConnect2':state.modal=true;render();break;case 'toggleDate':state.dateOpen=!state.dateOpen;render();break;case 'closeDate':state.dateOpen=false;render();break;case 'clearDate':applyDate('','');break;case 'applyDate':applyDate($('dateFrom').value,$('dateTo').value);break;case 'chart7':case 'chart14':case 'chart30':state.chartDays=Number(action.slice(5));render();break;case 'refresh':refresh();break;case 'saveMetaToken':saveMetaToken();break;case 'clearMetaToken':clearMetaToken();break;case 'export':exportCSV();break;case 'closeDrawer':if(target===e.target.closest('.drawer-cover')&&e.target.closest('.drawer')&&e.target!==target)return;state.selected=null;render();break;case 'saveDrawerNotes':updateLead(id,{admin_notes:$('drawerNotes').value});break;case 'saveInboxNotes':updateLead(id,{admin_notes:$('inboxNotes').value});break;case 'monthPrev':state.calendarMonth=new Date(state.calendarMonth.getFullYear(),state.calendarMonth.getMonth()-1,1);render();break;case 'monthNext':state.calendarMonth=new Date(state.calendarMonth.getFullYear(),state.calendarMonth.getMonth()+1,1);render();break;case 'monthToday':state.calendarMonth=new Date(now().getFullYear(),now().getMonth(),1);render();break;case 'disconnect':logout();break;case 'loadMore':refresh();break;}}
);
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){state.query=e.target.value;updateViewPreservingInput()}});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();login()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('globalSearch')?.focus()}if(e.key==='Escape'&&authorized){if(state.modal)state.modal=false;else if(state.selected)state.selected=null;else state.dateOpen=false;render()}});
sb=createRpcClient();render();initialize();
</script>
