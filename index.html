function datePicker(){return `<div class="date-wrap"><button class="btn" data-action="toggleDate">${ic('calendar')} ${esc(dateLabel())} ${ic('chev')}</button>${state.dateOpen?`<div class="date-popover" role="dialog" aria-label="Filter by calendar date"><div class="date-head"><strong>Filter by date</strong><button class="btn" style="padding:5px;min-height:29px" data-action="closeDate" aria-label="Close">${ic('x')}</button></div><div class="date-controls"><button data-preset="today">Today</button><button data-preset="week">7 days</button><button data-preset="days14">14 days</button><button data-preset="days30">30 days</button><button data-preset="days90">90 days</button><button data-preset="days180">180 days</button><button data-preset="days365">1 year</button><button data-preset="month">This month</button><button data-preset="all">All time</button></div><div class="date-mini-title">Date range</div><div class="date-inputs"><label>From<input id="dateFrom" type="date" value="${esc(state.dateFrom)}"></label><label>To<input id="dateTo" type="date" value="${esc(state.dateTo)}"></label></div><div class="date-footer"><button class="btn" data-action="clearDate">Clear</button><button class="btn primary" data-action="applyDate">Apply filter</button></div></div>`:''}</div>`}
function formatLastSync(){return state.lastSync?state.lastSync.toLocaleString(undefined,{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'}):'Not updated yet'}
function pageHeader(){const [h,sub]=heading();const tools=state.page==='settings'?'':state.page==='analytics'?`<div class="page-tools"><span class="sync-stamp">Last update: <b>${esc(formatLastSync())}</b></span><button class="btn" data-action="refresh">${ic('refresh')} Refresh</button></div>`:`<div class="page-tools"><span class="sync-stamp">Last update: <b>${esc(formatLastSync())}</b></span>${datePicker()}<button class="btn" data-action="refresh">${ic('refresh')} Refresh</button>${state.page==='leads'?`<button class="btn primary" data-action="export">${ic('download')} Export CSV</button>`:''}</div>`;return `<div class="page-header"><div><h1 class="page-title">${h}</h1><p class="page-desc">${sub}</p></div>${tools}</div>`}
function demoBanner(){return state.error?`<div class="live-error" role="alert">${ic('info')} <span>${esc(state.error)}</span><button data-action="refresh">Retry</button></div>`:state.loading?`<div class="demo-note">${ic('refresh')} Loading submissions from Supabase…</div>`:(!state.lastSync?`<div class="demo-note">${ic('info')} Dashboard loads leads when you press Refresh. Initial connection in progress…</div>`:`<div class="demo-note">${ic('info')} Manual refresh only · Last update: <b>${esc(formatLastSync())}</b></div>`)}
function lineChart(arr){
  const end=state.dateTo?new Date(state.dateTo+'T12:00:00'):new Date();
  let start=state.dateFrom?new Date(state.dateFrom+'T12:00:00'):null;
  if(!start){const times=arr.map(l=>parseDate(l.created_at).getTime()).filter(Number.isFinite);start=times.length?new Date(Math.min(...times)):new Date(end.getTime()-29*86400000)}
  start.setHours(0,0,0,0);end.setHours(23,59,59,999);
  if(start>end)return '<div class="empty">Please choose a valid date range.</div>';
  const days=Math.floor((end-start)/86400000)+1;
  const unit=days>2000?'year':days>180?'month':days>56?'week':'day';
  function bucket(d){if(unit==='year')return String(d.getFullYear());if(unit==='month')return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;if(unit==='week'){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return dayKey(x)}return dayKey(d)}
  const groups=new Map(),pointer=new Date(start.getFullYear(),start.getMonth(),start.getDate());
  for(let n=0;pointer<=end&&n<2500;n++){const b=bucket(pointer);if(!groups.has(b))groups.set(b,{key:b,total:0,yes:0,no:0,pending:0});if(unit==='year')pointer.setFullYear(pointer.getFullYear()+1);else if(unit==='month')pointer.setMonth(pointer.getMonth()+1);else pointer.setDate(pointer.getDate()+1)}
  for(const l of arr){const d=parseDate(l.created_at);if(isNaN(d.getTime())||d<start||d>end)continue;const row=groups.get(bucket(d));if(!row)continue;row.total++;const kind=safeStatus(l.status);row[kind==='Interested'?'yes':kind==='Not Interested'?'no':'pending']++}
  const rows=[...groups.values()];if(!rows.length)return '<div class="empty">No dates available.</div>';
  const maxValue=Math.max(1,...rows.map(r=>r.total)),step=Math.max(1,Math.ceil(maxValue/4)),maximum=step*4;
  const width=740,height=260,left=38,top=16,right=14,bottom=43,plotW=width-left-right,plotH=height-top-bottom;
  const x=i=>left+(rows.length===1?plotW/2:(i/(rows.length-1))*plotW);
  const y=n=>top+plotH-(n/maximum)*plotH;
  const series=[['total','#2a6b91','Total leads'],['yes','#159565','Interested'],['no','#d4646b','Not interested'],['pending','#9a9eac','Unmarked']];
  const paths=series.map(([k,color,label])=>{const path=rows.map((r,i)=>`${i===0?'M':'L'}${x(i).toFixed(2)},${y(r[k]).toFixed(2)}`).join(' ');
   const pts=rows.map((r,i)=>`<circle cx="${x(i).toFixed(2)}" cy="${y(r[k]).toFixed(2)}" r="${rows.length<58?2.8:2}" fill="${color}" class="line-point"><title>${esc(r.key)}: ${label}: ${r[k]}</title></circle>`).join('');
   return `<path d="${path}" fill="none" stroke="${color}" stroke-width="${k==='total'?2.8:2.1}" stroke-linejoin="round" stroke-linecap="round"/><g>${pts}</g>`}).join('');
  const axes=Array.from({length:5},(_,i)=>{const value=i*step,yy=y(value);return `<line class="trend-grid" x1="${left}" x2="${width-right}" y1="${yy}" y2="${yy}"/><text class="trend-label" x="${left-9}" y="${yy+4}" text-anchor="end">${value}</text>`}).join('');

async function fetchActiveOnly(){
 if(!authorized || !sessionToken || state.page!=='analytics' || document.hidden || activeRequestInFlight || !sb)return;

 try{
  const {data,error}=await sb.rpc('ilmix_password_active_count',{p_token:sessionToken});

// Dependency-free Supabase RPC wrapper. Keeps the existing Supabase SQL functions
// and the rest of the dashboard unchanged; reports errors instead of hanging.
function createRpcClient(){
  const root=SUPABASE_URL.replace(/\/$/,'');
  return {
    async rpc(functionName,payload={}){
      const controller=new AbortController();
      const abortTimer=setTimeout(()=>controller.abort(),15000);
      try{
        const response=await fetch(root+'/rest/v1/rpc/'+encodeURIComponent(functionName),{
          method:'POST',
          mode:'cors',
          cache:'no-store',
          headers:{
            'apikey':SUPABASE_PUBLISHABLE_KEY,
            'Content-Type':'application/json',
            'Accept':'application/json'
          },
          body:JSON.stringify(payload),
          signal:controller.signal
        });
        const raw=await response.text();
        let result=null;
        if(raw){try{result=JSON.parse(raw)}catch{result=raw}}
        if(!response.ok){
          const message=(result&&typeof result==='object'&&result.message)||('HTTP '+response.status);
          const detail=(result&&typeof result==='object'&&result.details)||'';
          return {data:null,error:{message:message+(detail?' — '+detail:''),code:(result&&result.code)||String(response.status)}};
        }
        return {data:result,error:null};
      }catch(error){
        const timedOut=error&&error.name==='AbortError';
        return {data:null,error:{message:timedOut?'Request timed out. Check your internet connection.':'Network request failed. Verify your connection, Supabase project URL and allowed site origin.',code:'NETWORK'}};
      }finally{clearTimeout(abortTimer)}
    }
  };
}

async function checkAuthorized(){
 if(!sessionToken){authorized=false;return false}
 const {data,error}=await sb.rpc('ilmix_password_session',{p_token:sessionToken});
 if(error)throw Error('Could not verify SQL login: '+error.message);
 authorized=data===true;
 if(!authorized){forgetToken();sessionToken=''}
 return authorized;
}
async function initialize(){
 try{
  sb=createRpcClient();
  sessionToken=savedToken();
  if(sessionToken){if(await checkAuthorized())await refresh(true);else authBootError='Your login expired. Enter your password again.'}
 }catch(e){authorized=false;authBootError='SQL login connection error: '+e.message+'. Run PASSWORD_ONLY_LOGIN.sql in Supabase SQL Editor.'}
 render();
}
async function login(){
 const btn=$('loginBtn'),pass=$('adminPassword')?.value||'';
 if(!btn)return;
 if(!pass){$('loginError').textContent='Please enter your dashboard password.';return;}
 btn.disabled=true;btn.textContent='Logging in…';$('loginError').textContent='Checking password…';
 try{
  if(!sb)throw Error('Supabase is not ready');
  const {data,error}=await sb.rpc('ilmix_password_login',{p_password:pass});
  if(error)throw Error(error.code==='PGRST202'||error.code==='404'?'Login function is missing in Supabase. Run PASSWORD_ONLY_LOGIN.sql in SQL Editor.':'Login connection error: '+error.message);
  if(data?.error==='invalid_password')throw Error('Wrong password. If you used another password before, run RESET_PASSWORD_TO_ILMIX.sql in Supabase SQL Editor.');
  if(data?.error==='locked')throw Error('Too many attempts. Try again in one minute.');
  if(data?.error==='not_configured')throw Error('Password has not been configured in Supabase SQL.');
  if(!data?.token)throw Error('SQL did not return a login session.');
  sessionToken=data.token;saveToken(sessionToken);authorized=true;
  state.leads=[];state.error='';await refresh(true);render();
 }catch(e){const el=$('loginError');if(el)el.textContent=e.message;btn.disabled=false;btn.textContent='Log in →';}
}
async function logout(){
 stopActiveCountPolling();
 const oldToken=sessionToken;
 sessionToken='';authorized=false;state.leads=[];state.analytics=null;state.analyticsError='';state.lastSync=null;state.error='';forgetToken();render();
 if(sb&&oldToken){try{await sb.rpc('ilmix_password_logout',{p_token:oldToken})}catch{}}
}
document.addEventListener('click',e=>{if(!authorized)return;const target=e.target.closest('[data-page],[data-action],[data-filter],[data-status],[data-open],[data-pick],[data-reply],[data-preset],[data-cal-day]');if(!target){if(state.dateOpen&&!e.target.closest('.date-wrap')){state.dateOpen=false;render()}return}const {page,action,filter,status,id,open,pick,reply,preset,calDay}=target.dataset;if(page){setPage(page);return}if(filter){state.statusFilter=filter;state.selected=null;render();return}if(status&&id){updateLead(id,{status:status==='Interested'?'interested':'not_interested'});return}if(open){state.selected=open;render();return}if(pick){state.selected=pick;render();return}if(reply){replyTo(reply);return}if(calDay){applyDate(calDay,calDay);state.page='leads';render();return}if(preset){const d=new Date(),t=dayKey(d);if(preset==='today')applyDate(t,t);if(preset==='all')applyDate('','');if(['week','days14','days30','days90','days180','days365'].includes(preset)){const n=({week:7,days14:14,days30:30,days90:90,days180:180,days365:365})[preset];d.setDate(d.getDate()-(n-1));applyDate(dayKey(d),t)}if(preset==='month'){d.setDate(1);applyDate(dayKey(d),t)}return}switch(action){case 'toggleMenu':state.menu=!state.menu;render();break;case 'closeMenu':state.menu=false;render();break;case 'openConnect':notify('Supabase is configured.');break;case 'closeModal':state.modal=false;render();break;case 'openConnect2':state.modal=true;render();break;case 'toggleDate':state.dateOpen=!state.dateOpen;render();break;case 'closeDate':state.dateOpen=false;render();break;case 'clearDate':applyDate('','');break;case 'applyDate':applyDate($('dateFrom').value,$('dateTo').value);break;case 'refresh':refresh();break;case 'export':exportCSV();break;case 'closeDrawer':if(target===e.target.closest('.drawer-cover')&&e.target.closest('.drawer')&&e.target!==target)return;state.selected=null;render();break;case 'saveDrawerNotes':updateLead(id,{admin_notes:$('drawerNotes').value});break;case 'saveInboxNotes':updateLead(id,{admin_notes:$('inboxNotes').value});break;case 'monthPrev':state.calendarMonth=new Date(state.calendarMonth.getFullYear(),state.calendarMonth.getMonth()-1,1);render();break;case 'monthNext':state.calendarMonth=new Date(state.calendarMonth.getFullYear(),state.calendarMonth.getMonth()+1,1);render();break;case 'monthToday':state.calendarMonth=new Date(now().getFullYear(),now().getMonth(),1);render();break;case 'disconnect':logout();break;case 'loadMore':refresh();break;}}
);
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){state.query=e.target.value;updateViewPreservingInput()}});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();login()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('globalSearch')?.focus()}if(e.key==='Escape'&&authorized){if(state.modal)state.modal=false;else if(state.selected)state.selected=null;else state.dateOpen=false;render()}});
sb=createRpcClient();render();initialize();
